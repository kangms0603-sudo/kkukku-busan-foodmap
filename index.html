const BUSAN_DONGS={"강서구":["강동동","구랑동","녹산동","눌차동","대저1동","대저2동","대항동","동선동","명지동","미음동","범방동","봉림동","생곡동","성북동","송정동","식만동","신호동","죽동동","죽림동","지사동","천성동","화전동"],"금정구":["구서동","금사동","금성동","남산동","노포동","두구동","부곡동","서동","선동","오륜동","장전동","청룡동","회동동"],"기장군":["기장읍","장안읍","정관읍","일광읍","철마면"],"남구":["감만동","대연동","문현동","용당동","용호동","우암동"],"동구":["범일동","수정동","좌천동","초량동"],"동래구":["낙민동","명륜동","명장동","복천동","사직동","수안동","안락동","온천동","칠산동"],"부산진구":["가야동","개금동","당감동","범전동","범천동","부암동","부전동","양정동","연지동","전포동","초읍동"],"북구":["구포동","금곡동","덕천동","만덕동","화명동"],"사상구":["감전동","괘법동","덕포동","모라동","삼락동","엄궁동","주례동","학장동"],"사하구":["감천동","괴정동","구평동","다대동","당리동","신평동","장림동","하단동"],"서구":["남부민동","동대신동1가","동대신동2가","동대신동3가","부민동1가","부민동2가","부민동3가","부용동1가","부용동2가","서대신동1가","서대신동2가","서대신동3가","아미동1가","아미동2가","암남동","초장동","충무동1가","충무동2가","충무동3가","토성동1가","토성동2가","토성동3가","토성동4가","토성동5가"],"수영구":["광안동","남천동","망미동","민락동","수영동"],"연제구":["거제동","연산동"],"영도구":["남항동1가","남항동2가","남항동3가","대교동1가","대교동2가","대평동1가","대평동2가","동삼동","봉래동1가","봉래동2가","봉래동3가","봉래동4가","봉래동5가","신선동1가","신선동2가","신선동3가","영선동1가","영선동2가","영선동3가","영선동4가","청학동"],"중구":["광복동1가","광복동2가","광복동3가","남포동1가","남포동2가","남포동3가","남포동4가","남포동5가","남포동6가","대창동1가","대창동2가","대청동1가","대청동2가","대청동3가","대청동4가","동광동1가","동광동2가","동광동3가","동광동4가","동광동5가","보수동1가","보수동2가","보수동3가","부평동1가","부평동2가","부평동3가","부평동4가","신창동1가","신창동2가","신창동3가","신창동4가","영주동","중앙동1가","중앙동2가","중앙동3가","중앙동4가","중앙동5가","중앙동6가","중앙동7가","창선동1가","창선동2가"],"해운대구":["반송동","반여동","석대동","송정동","우동","재송동","좌동","중동"]};
let restaurants=[],selectedGu='',selectedDong='',isAdmin=false;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){
 const q=$('search').value.trim().toLowerCase();
 const rows=restaurants.filter(r=>(!selectedGu||r.gu===selectedGu)&&(!selectedDong||r.dong===selectedDong)&&(!q||[r.name,r.gu,r.dong,r.category,r.menu,r.note].join(' ').toLowerCase().includes(q)));
 const ds=[...new Set([...(BUSAN_DONGS[selectedGu]||[]),...restaurants.filter(r=>r.gu===selectedGu).map(r=>r.dong).filter(Boolean)])].sort((a,b)=>a.localeCompare(b,'ko'));
 $('dongs').innerHTML=selectedGu?ds.map(d=>'<button class="chip '+(selectedDong===d?'active':'')+'" data-dong="'+esc(d)+'">'+esc(d)+'</button>').join(''):'';
 document.querySelectorAll('#dongs [data-dong]').forEach(b=>b.onclick=()=>{selectedDong=b.dataset.dong;render()});
 if(!selectedGu){
   $('title').textContent='지도에서 구·군을 선택하세요'; $('count').textContent='';
   $('cards').innerHTML='<div class="empty">🌊 부산 지도에서 원하는 구·군을 눌러주세요.<br>선택한 지역의 동네를 먼저 보여드립니다.</div>';
 }else if(!selectedDong){
   $('title').textContent=selectedGu+' · 동네 선택'; $('count').textContent=ds.length+'개 동네';
   $('cards').innerHTML=ds.length?'<div class="empty">📍 위에서 동네를 선택하면 해당 동의 맛집만 표시됩니다.</div>':'<div class="empty">아직 '+esc(selectedGu)+'에 등록된 동네가 없습니다.</div>';
 }else{
   $('title').textContent=selectedDong+' 맛집'; $('count').textContent=rows.length+'곳';
   $('cards').innerHTML=rows.length?rows.map(r=>`<article class="card"><span class="badge">${esc(r.gu)} · ${esc(r.dong)}</span><h3>${esc(r.name)}</h3><div class="meta">${esc(r.category||'맛집')}${r.menu?' · '+esc(r.menu):''}</div>${r.note?'<div class="review">'+esc(r.note)+'</div>':''}${r.blog_url?'<a class="link" target="_blank" rel="noopener" href="'+esc(r.blog_url)+'">블로그 후기 보기 →</a>':''}${isAdmin?'<div class="card-actions"><button class="mini" data-edit="'+r.id+'">수정</button><button class="mini" data-del="'+r.id+'">삭제</button></div>':''}</article>`).join(''):'<div class="empty">이 동네에는 아직 등록된 맛집이 없습니다.</div>';
 }
 document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEdit(Number(b.dataset.edit)));
 document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>removeRestaurant(Number(b.dataset.del)));
 document.querySelectorAll('.region').forEach(g=>g.classList.toggle('active',g.dataset.gu===selectedGu));
 $('all').classList.toggle('active',!selectedGu);
}
async function load(){
 const {data,error}=await db.from('restaurants').select('*').order('created_at',{ascending:false});
 if(error){$('cards').innerHTML='<div class="empty">데이터를 불러오지 못했습니다.<br>'+esc(error.message)+'</div>';return}
 restaurants=data||[];render();
}
function authUI(session){
 isAdmin=!!session;
 $('loginBtn').hidden=isAdmin;$('logoutBtn').hidden=!isAdmin;$('addBtn').hidden=!isAdmin;
 $('authState').textContent=isAdmin?'관리자 모드':'';
 render();
}
document.querySelectorAll('.region').forEach(g=>{g.onclick=()=>{selectedGu=g.dataset.gu;selectedDong='';render()};g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();g.click()}}});
$('all').onclick=()=>{selectedGu='';selectedDong='';render()};
$('search').oninput=render;
GU.forEach(g=>$('fGu').insertAdjacentHTML('beforeend','<option>'+g+'</option>'));
$('loginBtn').onclick=()=>$('loginDialog').showModal();
$('loginCancel').onclick=()=>$('loginDialog').close();
$('loginForm').onsubmit=async e=>{e.preventDefault();const {error}=await db.auth.signInWithPassword({email:$('loginEmail').value.trim(),password:$('loginPassword').value});if(error)return alert('로그인 실패: '+error.message);$('loginDialog').close();$('loginForm').reset()};
$('logoutBtn').onclick=()=>db.auth.signOut();
$('addBtn').onclick=()=>{$('restaurantForm').reset();$('editId').value='';$('modalTitle').textContent='맛집 등록';$('restaurantDialog').showModal()};
$('cancelBtn').onclick=()=>$('restaurantDialog').close();
function openEdit(id){const r=restaurants.find(x=>x.id===id);if(!r)return;$('editId').value=r.id;$('fName').value=r.name||'';$('fGu').value=r.gu||'';$('fDong').value=r.dong||'';$('fCat').value=r.category||'';$('fMenu').value=r.menu||'';$('fUrl').value=r.blog_url||'';$('fNote').value=r.note||'';$('modalTitle').textContent='맛집 수정';$('restaurantDialog').showModal()}
$('restaurantForm').onsubmit=async e=>{e.preventDefault();const id=$('editId').value;const row={name:$('fName').value.trim(),gu:$('fGu').value,dong:$('fDong').value.trim(),category:$('fCat').value.trim(),menu:$('fMenu').value.trim(),blog_url:$('fUrl').value.trim(),note:$('fNote').value.trim()};const res=id?await db.from('restaurants').update(row).eq('id',id):await db.from('restaurants').insert(row);if(res.error)return alert('저장 실패: '+res.error.message);$('restaurantDialog').close();await load()};
async function removeRestaurant(id){if(!confirm('이 맛집을 삭제할까요?'))return;const {error}=await db.from('restaurants').delete().eq('id',id);if(error)return alert('삭제 실패: '+error.message);await load()}
db.auth.getSession().then(({data})=>authUI(data.session));
db.auth.onAuthStateChange((_e,session)=>authUI(session));
load();
</script>
</body></html>
