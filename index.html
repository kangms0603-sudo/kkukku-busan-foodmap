<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>꾸꾸의 부산 맛지도 | 부산 로컬 맛집</title>
<meta name="description" content="맛지도 제작자 꾸꾸가 직접 다녀온 부산 로컬 맛집을 구·군과 동네별로 찾아보는 부산 맛지도입니다.">
<style>
:root{--bg:#fffaf3;--ink:#28231f;--sub:#766e67;--accent:#e55d3c;--sea:#dff3f3;--land:#f3d3a3;--line:#fff}
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink)}
header{text-align:center;padding:28px 16px 15px}h1{margin:0;font-size:28px}header p{color:var(--sub);margin:8px 0 0}
.wrap{max-width:900px;margin:auto;padding:14px} .search{width:100%;padding:15px;border:1px solid #eadfd5;border-radius:16px;font-size:16px;background:#fff}
.mapbox{margin-top:15px;background:var(--sea);border-radius:26px;padding:8px;box-shadow:0 8px 24px #735c4620}
svg{width:100%;height:auto;display:block} .region polygon{fill:var(--land);stroke:var(--line);stroke-width:3;cursor:pointer;transition:.15s}
.region:hover polygon,.region.active polygon{fill:var(--accent)} .region text{font-size:12px;font-weight:800;text-anchor:middle;dominant-baseline:middle;pointer-events:none;fill:#493c32}
.region:hover text,.region.active text{fill:#fff} .sea-label{fill:#6ba9ad;font-size:12px;font-weight:700;letter-spacing:3px}
.note{font-size:12px;color:var(--sub);margin:9px 4px 0;line-height:1.5}
.controls{display:flex;gap:8px;overflow:auto;padding:15px 0 4px}button{font:inherit}.chip{border:1px solid #eadfd5;background:#fff;border-radius:999px;padding:9px 13px;white-space:nowrap}.chip.active{background:var(--ink);color:white}
.head{display:flex;justify-content:space-between;align-items:end;margin:20px 2px 10px}.head h2{margin:0;font-size:21px}.head span{font-size:13px;color:var(--sub)}.dongs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{background:white;border:1px solid #eadfd5;border-radius:18px;padding:16px}.badge{font-size:12px;background:#fff0e8;color:#ad4028;border-radius:99px;padding:5px 8px}.card h3{margin:10px 0 5px}.meta{font-size:13px;color:var(--sub);line-height:1.6}.review{font-size:14px;margin-top:9px;line-height:1.55}.link{display:inline-block;margin-top:11px;color:var(--accent);font-weight:800;text-decoration:none}.empty{grid-column:1/-1;text-align:center;padding:28px;color:var(--sub)}footer{text-align:center;color:#978c83;font-size:12px;padding:32px}

.addbar{display:flex;gap:8px;margin:16px 0 6px}.primary{border:0;background:var(--accent);color:#fff;border-radius:14px;padding:12px 16px;font-weight:800;cursor:pointer}.secondary{border:1px solid #eadfd5;background:#fff;border-radius:14px;padding:12px 14px;cursor:pointer}
.cardimg{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:13px;margin-bottom:12px;background:#f3eee8}.stars{font-size:14px;margin-top:7px}.actions{display:flex;gap:7px;margin-top:12px}.mini{border:1px solid #eadfd5;background:#fff;border-radius:10px;padding:7px 9px;font-size:12px;cursor:pointer}
dialog{border:0;border-radius:22px;padding:0;width:min(92vw,520px);box-shadow:0 24px 80px #0004}dialog::backdrop{background:#0006}.modal{padding:20px}.modal h2{margin:0 0 15px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.formgrid .full{grid-column:1/-1}.formgrid label{font-size:12px;color:var(--sub);display:block;margin-bottom:5px}.formgrid input,.formgrid select,.formgrid textarea{width:100%;border:1px solid #e5d9ce;border-radius:11px;padding:11px;font:inherit;background:#fff}.formgrid textarea{min-height:76px;resize:vertical}.modalfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.hint{font-size:12px;color:var(--sub);line-height:1.5;margin:10px 0 0}.photoPreview{display:none;width:100%;max-height:180px;object-fit:cover;border-radius:12px;margin-top:8px}
@media(max-width:600px){.formgrid{grid-template-columns:1fr}}

@media(max-width:600px){.grid{grid-template-columns:1fr}.region text{font-size:11px}}
</style></head><body>
<header><h1>🍚 꾸꾸의 부산 맛지도</h1><p>부산 16개 구·군 → 동네 → 방문 맛집 순서로 찾아보세요.</p></header>
<main class="wrap">
<input id="search" class="search" placeholder="식당명 · 동네 · 메뉴 검색">
<div class="mapbox"><svg viewBox="20 10 520 425" role="img" aria-label="부산광역시 16개 구군 맛지도">
<text class="sea-label" x="415" y="385">BUSAN SEA</text>
<g class="region" data-gu="강서구" tabindex="0"><polygon points="70,195 165,178 198,218 181,305 135,335 82,300 45,245"/><text x="125" y="254">강서구</text></g>
<g class="region" data-gu="북구" tabindex="0"><polygon points="180,112 236,98 258,154 230,207 190,197 164,161"/><text x="210" y="155">북구</text></g>
<g class="region" data-gu="금정구" tabindex="0"><polygon points="250,58 326,42 357,94 337,166 281,169 253,137"/><text x="301" y="111">금정구</text></g>
<g class="region" data-gu="기장군" tabindex="0"><polygon points="349,35 457,25 516,70 510,150 467,192 402,169 361,116"/><text x="437" y="108">기장군</text></g>
<g class="region" data-gu="사상구" tabindex="0"><polygon points="181,205 232,202 253,258 224,305 179,294 163,250"/><text x="205" y="252">사상구</text></g>
<g class="region" data-gu="부산진구" tabindex="0"><polygon points="237,190 291,178 320,224 297,276 248,263 226,220"/><text x="270" y="225">부산진구</text></g>
<g class="region" data-gu="동래구" tabindex="0"><polygon points="292,151 345,147 366,192 340,226 307,216 286,179"/><text x="323" y="185">동래구</text></g>
<g class="region" data-gu="연제구" tabindex="0"><polygon points="314,219 361,201 386,239 361,272 315,266 299,239"/><text x="339" y="239">연제구</text></g>
<g class="region" data-gu="해운대구" tabindex="0"><polygon points="372,169 449,160 487,206 462,260 398,259 369,224"/><text x="423" y="213">해운대구</text></g>
<g class="region" data-gu="사하구" tabindex="0"><polygon points="142,305 218,306 236,354 201,397 136,384 105,345"/><text x="173" y="348">사하구</text></g>
<g class="region" data-gu="서구" tabindex="0"><polygon points="220,302 257,292 274,332 250,365 217,351"/><text x="244" y="328">서구</text></g>
<g class="region" data-gu="중구" tabindex="0"><polygon points="259,288 282,284 294,314 275,334 259,320"/><text x="274" y="308">중구</text></g>
<g class="region" data-gu="동구" tabindex="0"><polygon points="282,264 316,262 329,302 299,320 283,299"/><text x="302" y="289">동구</text></g>
<g class="region" data-gu="남구" tabindex="0"><polygon points="315,285 371,275 397,321 369,355 321,337 299,309"/><text x="345" y="314">남구</text></g>
<g class="region" data-gu="수영구" tabindex="0"><polygon points="369,260 406,255 427,287 400,315 378,299"/><text x="396" y="283">수영구</text></g>
<g class="region" data-gu="영도구" tabindex="0"><polygon points="269,337 324,338 347,382 307,414 261,390 246,359"/><text x="292" y="370">영도구</text></g>
</svg></div>
<p class="note">※ 구·군을 누르면 아래에 동네 목록이 나타납니다. 맛집 탐색용으로 단순화한 지도이며 실제 경계·면적 측량용 지도가 아닙니다.</p>
<div class="controls"><button class="chip" id="allBusan">📍 부산 전체</button></div><div class="controls" id="filters"></div>

<div class="addbar">
<button class="primary" id="addRestaurant">＋ 맛집 추가</button>
<button class="secondary" id="backupBtn">데이터 내보내기</button>
<label class="secondary" style="cursor:pointer">가져오기<input id="importFile" type="file" accept=".json" hidden></label>
</div>
<dialog id="editor">
<form method="dialog" class="modal" id="restaurantForm">
<h2 id="editorTitle">맛집 추가</h2>
<input type="hidden" id="editId">
<div class="formgrid">
<div><label>상호명 *</label><input id="fName" required></div>
<div><label>카테고리</label><select id="fCat"><option>한식</option><option>고기</option><option>국밥</option><option>회·해산물</option><option>면</option><option>카페</option><option>중식</option><option>일식</option><option>기타</option></select></div>
<div><label>구·군 *</label><select id="fGu" required></select></div>
<div><label>동·읍·면 *</label><select id="fDong" required></select></div>
<div class="full"><label>대표메뉴</label><input id="fMenu" placeholder="예: 낙곱새"></div>
<div><label>내 평가 (1~5)</label><select id="fRating"><option value="5">5</option><option value="4">4</option><option value="3">3</option><option value="2">2</option><option value="1">1</option></select></div>
<div><label>방문일</label><input id="fDate" type="date"></div>
<div class="full"><label>한줄평</label><textarea id="fNote" placeholder="직접 먹어본 느낌을 짧게 기록하세요."></textarea></div>
<div class="full"><label>네이버 블로그 후기 주소</label><input id="fUrl" type="url" placeholder="https://..."></div>
<div class="full"><label>대표사진</label><input id="fPhoto" type="file" accept="image/*"><img id="photoPreview" class="photoPreview"><input type="hidden" id="photoData"></div>
</div>
<p class="hint">사진은 브라우저 저장공간을 사용하므로 너무 큰 사진은 자동으로 축소해 저장합니다. 이 버전의 데이터는 현재 브라우저에 저장됩니다.</p>
<div class="modalfoot"><button class="secondary" value="cancel">취소</button><button class="primary" id="saveRestaurant" value="default">저장</button></div>
</form></dialog>

<div class="head"><h2 id="title">부산 전체 맛집</h2><span id="count"></span></div>
<div class="dongs" id="dongs"></div><div class="grid" id="cards"></div>
</main><footer>맛지도 제작자 꾸꾸 · BUSAN FOOD MAP</footer>
<script>
const defaultRestaurants=[
{name:"개미집",gu:"연제구",dong:"거제동",cat:"한식",menu:"낙곱새",note:"거제동 방문 맛집. 블로그 후기 주소를 연결할 수 있습니다.",url:"#"},
{name:"수매풍",gu:"연제구",dong:"거제동",cat:"한식",menu:"대표메뉴 입력",note:"방문 정보를 수정해 주세요.",url:"#"},
{name:"동래밀면",gu:"동래구",dong:"수안동",cat:"면",menu:"밀면",note:"부산 밀면 맛집 기록.",url:"#"}
];
let restaurants=JSON.parse(localStorage.getItem("kkukkuRestaurantsV4")||"null")||defaultRestaurants.map((r,i)=>({...r,id:"sample"+i,rating:5,date:"",photo:""}));
const districtDongs={
"중구":["중앙동","동광동","대청동","보수동","부평동","광복동","남포동","영주동"],
"서구":["동대신동","서대신동","부민동","아미동","초장동","충무동","남부민동","암남동"],
"동구":["초량동","수정동","좌천동","범일동"],
"영도구":["대교동","대평동","남항동","영선동","신선동","봉래동","청학동","동삼동"],
"부산진구":["부전동","연지동","초읍동","양정동","전포동","부암동","당감동","가야동","개금동","범천동"],
"동래구":["수안동","명륜동","온천동","복천동","칠산동","낙민동","안락동","명장동","사직동"],
"남구":["대연동","용호동","용당동","감만동","우암동","문현동"],
"북구":["구포동","금곡동","화명동","덕천동","만덕동"],
"해운대구":["우동","중동","좌동","송정동","반여동","반송동","석대동","재송동"],
"사하구":["괴정동","당리동","하단동","신평동","장림동","다대동","구평동","감천동"],
"금정구":["두구동","노포동","청룡동","남산동","선동","오륜동","구서동","장전동","부곡동","서동","금사동","회동동","금성동"],
"강서구":["대저1동","대저2동","강동동","명지동","죽림동","식만동","죽동동","봉림동","송정동","화전동","녹산동","생곡동","구랑동","지사동","미음동","범방동","신호동","동선동","성북동","눌차동","천성동","대항동"],
"연제구":["거제동","연산동"],
"수영구":["망미동","수영동","민락동","광안동","남천동"],
"사상구":["삼락동","모라동","덕포동","괘법동","감전동","주례동","학장동","엄궁동"],
"기장군":["기장읍","장안읍","정관읍","일광읍","철마면"]
};
const cats=["전체","한식","고기","국밥","회·해산물","면","카페"];
let gu="전체",dong="전체",cat="전체";
const filters=document.querySelector("#filters"),dongs=document.querySelector("#dongs"),cards=document.querySelector("#cards");
cats.forEach(c=>{const b=document.createElement("button");b.className="chip"+(c==="전체"?" active":"");b.textContent=c;b.onclick=()=>{cat=c;[...filters.children].forEach(x=>x.classList.toggle("active",x.textContent===c));render()};filters.appendChild(b)});
document.querySelectorAll(".region").forEach(r=>{const go=()=>{gu=gu===r.dataset.gu?"전체":r.dataset.gu;dong="전체";document.querySelectorAll(".region").forEach(x=>x.classList.toggle("active",x.dataset.gu===gu));render()};r.onclick=go;r.onkeydown=e=>{if(e.key==="Enter"||e.key===" ")go()}});
document.querySelector("#allBusan").onclick=()=>{gu="전체";dong="전체";document.querySelectorAll(".region").forEach(x=>x.classList.remove("active"));render()};
document.querySelector("#search").oninput=render;
function render(){
 const q=document.querySelector("#search").value.trim().toLowerCase();
 let base=restaurants.filter(r=>(gu==="전체"||r.gu===gu)&&(cat==="전체"||r.cat===cat));
 const ds=gu==="전체"?[]:(districtDongs[gu]||[]); dongs.innerHTML="";
 if(gu!=="전체")["전체",...ds].forEach(d=>{const b=document.createElement("button");b.className="chip"+(dong===d?" active":"");b.textContent=d;b.onclick=()=>{dong=d;render()};dongs.appendChild(b)});
 const list=base.filter(r=>(dong==="전체"||r.dong===dong)&&(!q||[r.name,r.gu,r.dong,r.cat,r.menu].join(" ").toLowerCase().includes(q)));
 document.querySelector("#title").textContent=(gu==="전체"?"부산 전체":gu)+(dong==="전체"?"":" · "+dong)+" 맛집";
 document.querySelector("#count").textContent=list.length+"곳";
 cards.innerHTML=list.length?list.map(r=>`<article class="card">${r.photo?`<img class="cardimg" src="${r.photo}" alt="${r.name}">`:""}<span class="badge">${r.cat}</span><h3>${r.name}</h3><div class="meta">📍 ${r.gu} ${r.dong}<br>🍴 ${r.menu||"대표메뉴 미입력"}${r.date?`<br>📅 ${r.date}`:""}</div><div class="stars">${"★".repeat(Number(r.rating||0))}${"☆".repeat(5-Number(r.rating||0))}</div><div class="review">${r.note||""}</div>${r.url&&r.url!=="#"?`<a class="link" href="${r.url}" target="_blank" rel="noopener">블로그 후기 보기 →</a>`:""}<div class="actions"><button class="mini" onclick="editRestaurant('${r.id}')">수정</button><button class="mini" onclick="deleteRestaurant('${r.id}')">삭제</button></div></article>`).join(""):`<div class="empty">📍 ${dong==="전체"?(gu==="전체"?"부산":gu):dong}<br><br>아직 등록된 맛집이 없습니다.<br><small>방문한 식당을 추가하면 이곳에 자동으로 표시됩니다.</small></div>`;
}

const editor=document.querySelector("#editor"), form=document.querySelector("#restaurantForm");
const fGu=document.querySelector("#fGu"),fDong=document.querySelector("#fDong");
function saveDB(){localStorage.setItem("kkukkuRestaurantsV4",JSON.stringify(restaurants))}
function fillGu(){fGu.innerHTML=Object.keys(districtDongs).map(g=>`<option>${g}</option>`).join(""); if(gu!=="전체")fGu.value=gu; fillDong()}
function fillDong(){const a=districtDongs[fGu.value]||[];fDong.innerHTML=a.map(d=>`<option>${d}</option>`).join(""); if(dong!=="전체"&&a.includes(dong))fDong.value=dong}
fGu.onchange=fillDong;
document.querySelector("#addRestaurant").onclick=()=>{form.reset();document.querySelector("#editId").value="";document.querySelector("#photoData").value="";document.querySelector("#photoPreview").style.display="none";document.querySelector("#editorTitle").textContent="맛집 추가";fillGu();editor.showModal()};
document.querySelector("#fPhoto").onchange=async e=>{
 const file=e.target.files[0];if(!file)return;
 const img=new Image(), reader=new FileReader();
 reader.onload=()=>img.src=reader.result; reader.readAsDataURL(file);
 img.onload=()=>{const max=1000,scale=Math.min(1,max/img.width),c=document.createElement("canvas");c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext("2d").drawImage(img,0,0,c.width,c.height);const data=c.toDataURL("image/jpeg",.78);document.querySelector("#photoData").value=data;const p=document.querySelector("#photoPreview");p.src=data;p.style.display="block"};
};
document.querySelector("#saveRestaurant").onclick=e=>{
 e.preventDefault();if(!document.querySelector("#fName").value.trim()){alert("상호명을 입력해주세요.");return}
 const id=document.querySelector("#editId").value||("r"+Date.now());
 const item={id,name:document.querySelector("#fName").value.trim(),cat:document.querySelector("#fCat").value,gu:fGu.value,dong:fDong.value,menu:document.querySelector("#fMenu").value.trim(),rating:Number(document.querySelector("#fRating").value),date:document.querySelector("#fDate").value,note:document.querySelector("#fNote").value.trim(),url:document.querySelector("#fUrl").value.trim()||"#",photo:document.querySelector("#photoData").value};
 const i=restaurants.findIndex(x=>x.id===id);if(i>=0)restaurants[i]=item;else restaurants.unshift(item);saveDB();editor.close();gu=item.gu;dong=item.dong;document.querySelectorAll(".region").forEach(x=>x.classList.toggle("active",x.dataset.gu===gu));render()
};
window.editRestaurant=id=>{const r=restaurants.find(x=>x.id===id);if(!r)return;document.querySelector("#editId").value=r.id;document.querySelector("#editorTitle").textContent="맛집 수정";fillGu();fGu.value=r.gu;fillDong();fDong.value=r.dong;document.querySelector("#fName").value=r.name;document.querySelector("#fCat").value=r.cat;document.querySelector("#fMenu").value=r.menu||"";document.querySelector("#fRating").value=r.rating||5;document.querySelector("#fDate").value=r.date||"";document.querySelector("#fNote").value=r.note||"";document.querySelector("#fUrl").value=r.url==="#"?"":r.url||"";document.querySelector("#photoData").value=r.photo||"";const p=document.querySelector("#photoPreview");if(r.photo){p.src=r.photo;p.style.display="block"}else p.style.display="none";editor.showModal()};
window.deleteRestaurant=id=>{const r=restaurants.find(x=>x.id===id);if(r&&confirm(`"${r.name}"을 맛지도에서 삭제할까요?`)){restaurants=restaurants.filter(x=>x.id!==id);saveDB();render()}};
document.querySelector("#backupBtn").onclick=()=>{const blob=new Blob([JSON.stringify(restaurants,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="kkukku_busan_foodmap_backup.json";a.click();URL.revokeObjectURL(a.href)};
document.querySelector("#importFile").onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!Array.isArray(d))throw 0;restaurants=d;saveDB();render();alert("맛집 데이터를 가져왔습니다.")}catch{alert("올바른 백업 파일이 아닙니다.")}};rd.readAsText(f)};

render();
</script></body></html>
